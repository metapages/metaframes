# Deploy every frame to Cloudflare Workers when main moves.
#
# A merged pull request is a push to main, so this covers merges and direct
# pushes alike. The work itself lives in the justfile — `just deploy` is
# check -> build -> wrangler deploy — so this file stays a thin wrapper and
# CI cannot drift from what a deploy does on a laptop.
#
# A failing `just check` fails the deploy, which is the point: main is what is
# served, so nothing reaches production without passing fmt, lint, type check
# and the unit tests.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   a token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account the worker belongs to
name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  # So a deploy can be re-run without an empty commit — after rotating the API
  # token, say.
  workflow_dispatch:

# Two merges in quick succession would otherwise race, and the loser could
# overwrite the newer deployment. Queue them instead of cancelling: every
# commit on main should reach production, and a deploy is short.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, check and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://metaframes.dion19.workers.dev
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Setup deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup just
        uses: extractions/setup-just@v2

      # deno.json sets nodeModulesDir: manual, so npm dependencies — wrangler
      # among them — are a real node_modules that is worth caching.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      - name: Deploy
        run: just deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
